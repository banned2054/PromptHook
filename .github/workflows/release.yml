name: release

# 仅正式发布（Publish）触发；创建/编辑草稿（Draft）不触发
on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x
            - run: dotnet test -c Release

    build:
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - rid: linux-x64
                      os: ubuntu-latest
                    - rid: win-x64
                      os: windows-latest
                    - rid: osx-arm64
                      os: macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x
            - name: Install native toolchain
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
            - name: Publish (NativeAOT)
              shell: bash
              env:
                  RID: ${{ matrix.rid }}
              run: |
                  # tag 形如 v1.0.0，去掉 v 前缀作为程序集版本
                  VERSION="${GITHUB_REF_NAME#v}"
                  dotnet publish PromptHook/PromptHook.csproj -c Release -r "$RID" -p:Version="$VERSION"
            - name: Package
              shell: bash
              env:
                  RID: ${{ matrix.rid }}
              run: |
                  cd "PromptHook/bin/Release/net10.0/$RID/publish"
                  PKG="$RUNNER_TEMP/prompt-hook-${GITHUB_REF_NAME}-${RID}"
                  if [[ "$RID" == win-* ]]; then
                    # Windows runner 的 System32\tar.exe 是 bsdtar，-a 按扩展名生成 zip
                    tar -a -cf "$PKG.zip" prompt-hook.exe prompt-hook.json
                  else
                    tar -czf "$PKG.tar.gz" prompt-hook prompt-hook.json
                  fi
            - uses: actions/upload-artifact@v7
              with:
                  name: prompt-hook-${{ matrix.rid }}
                  path: ${{ runner.temp }}/prompt-hook-*-${{ matrix.rid }}.*
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: prompt-hook-*
                  merge-multiple: true
                  path: dist
            - name: Generate checksums
              run: |
                  cd dist
                  sha256sum prompt-hook-* > SHA256SUMS.txt
                  cat SHA256SUMS.txt
            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.release.tag_name }}
                  files: dist/*
